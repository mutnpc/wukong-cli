name: Test install script

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate installer shell syntax
        run: sh -n install.sh

      - name: Validate current release truth
        run: node scripts/validate-release-truth.mjs

      - name: Test exact deployment marker contract
        run: node --test tests/release-marker.test.mjs

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Run install script tests
        run: bats tests/install.bats
