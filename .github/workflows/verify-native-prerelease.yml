name: Verify published native prerelease

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: true
        type: string
      expected_latest_tag:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      source_run:
        required: true
        type: string
      distribution_sha:
        required: true
        type: string
      website_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify immutable identity, attestations, assets, and stable latest
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      EXPECTED_LATEST_TAG: ${{ inputs.expected_latest_tag }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_RUN: ${{ inputs.source_run }}
      DISTRIBUTION_SHA: ${{ inputs.distribution_sha }}
      WEBSITE_SHA: ${{ inputs.website_sha }}
    steps:
      - name: Checkout exact release distribution contract
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.distribution_sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Download and validate every anonymous public asset
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha)" = "$DISTRIBUTION_SHA"
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "false"
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = "true"
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isImmutable --jq .isImmutable)" = "true"
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')" = "13"
          mkdir anonymous-assets
          for NAME in \
            release-provenance.json \
            wukong-linux-x64.zip wukong-linux-x64.zip.sha256 \
            wukong-linux-arm64.zip wukong-linux-arm64.zip.sha256 \
            wukong-darwin-x64.zip wukong-darwin-x64.zip.sha256 \
            wukong-darwin-arm64.zip wukong-darwin-arm64.zip.sha256 \
            wukong-win32-x64.zip wukong-win32-x64.zip.sha256 \
            wukong-win32-arm64.zip wukong-win32-arm64.zip.sha256; do
            curl -fsSL --retry 3 --retry-all-errors \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${NAME}" \
              -o "anonymous-assets/${NAME}"
          done
          node scripts/validate-native-release-assets.mjs \
            anonymous-assets "$RELEASE_TAG" "$SOURCE_SHA" "$SOURCE_RUN" \
            "$DISTRIBUTION_SHA" "$WEBSITE_SHA"

      - name: Verify public attestations and preserved stable latest
        shell: bash
        run: |
          set -euo pipefail
          for FILE in anonymous-assets/*.zip; do
            gh attestation verify "$FILE" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-native-prerelease.yml" \
              --source-digest "$DISTRIBUTION_SHA"
          done
          test "$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" = "$EXPECTED_LATEST_TAG"
          test "$EXPECTED_LATEST_TAG" != "$RELEASE_TAG"
