name: Verify Release Version Alignment

on:
  pull_request:
    paths:
      - 'CHANGELOG.md'
      - 'README.md'
      - 'docs/**'
      - 'scripts/validate-release-truth.mjs'
      - '.github/workflows/verify-release-alignment.yml'
  push:
    branches: [main]
    paths:
      - 'CHANGELOG.md'
      - 'README.md'
      - 'docs/**'
      - 'scripts/validate-release-truth.mjs'
      - '.github/workflows/verify-release-alignment.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag to verify, for example v0.0.22'
        required: false

permissions:
  contents: read

jobs:
  verify-version-alignment:
    name: Block drift before release publication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify changelog, README, and public docs agree
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_TAG" ]]; then
            node scripts/validate-release-truth.mjs "${RELEASE_TAG#v}"
          else
            node scripts/validate-release-truth.mjs
          fi
